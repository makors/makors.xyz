<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>cdn upload</title>
<style>
:root {
    --bg: #0b0b0c;
    --surface: #131315;
    --line: #26262a;
    --text: #ededef;
    --muted: #8a8a92;
    --accent: #ededef;
    --ok: #4ade80;
    --bad: #f87171;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 48px 24px 96px;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; }
p.sub { margin: 0 0 32px; color: var(--muted); }
#drop {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
}
#drop:hover, #drop.over { border-color: #4a4a52; background: var(--surface); }
#drop strong { color: var(--text); font-weight: 500; }
.controls {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
    margin: 20px 0 0;
    color: var(--muted);
}
.controls label { display: flex; align-items: center; gap: 8px; }
select, input[type=range] { accent-color: var(--accent); }
select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 8px;
    font: inherit;
}
#list, #recent { display: flex; flex-direction: column; gap: 8px; }
#list { margin: 32px 0 0; }
.item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
}
.item .line { display: flex; gap: 12px; align-items: center; }
.item .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The manifest line is a copy target, not reading matter, so it stays in the
   page's sans face rather than switching to monospace. */
.entry {
    font: inherit;
    color: var(--muted);
    font-size: 12.5px;
    white-space: nowrap;
    overflow-x: auto;
    padding-bottom: 2px;
    border-top: 1px solid var(--line);
    padding-top: 9px;
}
.item .meta { color: var(--muted); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.item a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
.item a:hover { border-bottom-color: var(--muted); }
.item.failed .meta { color: var(--bad); }
button.copy {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 4px;
    padding: 3px 10px;
    font: inherit;
    cursor: pointer;
    flex: 0 0 auto;
}
button.copy:hover { color: var(--text); border-color: #4a4a52; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 40px 0 12px; }
@media (prefers-color-scheme: light) {
    :root { --bg: #fff; --surface: #fafafa; --line: #e4e4e7; --text: #18181b; --muted: #71717a; --accent: #18181b; }
}
</style>
</head>
<body>
<main>
    <h1>cdn upload</h1>
    <p class="sub">Images are resized and re-encoded to WebP in this browser, then stored in R2.</p>

    <div id="drop" tabindex="0">
        <strong>Drop images here</strong><br>or click to choose
    </div>
    <input id="picker" type="file" accept="image/*" multiple hidden>

    <div class="controls">
        <label>Max edge
            <select id="maxEdge">
                <option value="1280">1280px</option>
                <option value="1920">1920px</option>
                <option value="2560" selected>2560px</option>
                <option value="3840">3840px</option>
                <option value="0">Keep size</option>
            </select>
        </label>
        <label>Quality
            <input id="quality" type="range" min="50" max="95" value="82">
            <span id="qualityValue" class="meta">82</span>
        </label>
    </div>

    <div id="list"></div>

    <h2 id="recentHeading" hidden>Recent</h2>
    <div id="recent"></div>
</main>

<script type="module">
const PASS_THROUGH = new Set(["image/gif"]);
const ALLOWED = new Set(["image/webp", "image/avif", "image/jpeg", "image/png", "image/gif"]);
const STORE_KEY = "cdn.recent";

const drop = document.getElementById("drop");
const picker = document.getElementById("picker");
const list = document.getElementById("list");
const recent = document.getElementById("recent");
const recentHeading = document.getElementById("recentHeading");
const maxEdge = document.getElementById("maxEdge");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

quality.oninput = () => { qualityValue.textContent = quality.value; };
drop.onclick = () => picker.click();
drop.onkeydown = (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); picker.click(); } };
picker.onchange = () => { handle([...picker.files]); picker.value = ""; };

for (const name of ["dragenter", "dragover"]) {
    drop.addEventListener(name, (event) => { event.preventDefault(); drop.classList.add("over"); });
}
for (const name of ["dragleave", "drop"]) {
    drop.addEventListener(name, () => drop.classList.remove("over"));
}
drop.addEventListener("drop", (event) => {
    event.preventDefault();
    handle([...event.dataTransfer.files].filter((file) => file.type.startsWith("image/")));
});
document.addEventListener("paste", (event) => {
    const files = [...(event.clipboardData?.files ?? [])].filter((file) => file.type.startsWith("image/"));
    if (files.length) handle(files);
});

function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

/** A line ready to paste into src/photos.ts on the site. */
function manifestEntry(upload) {
    const dimensions = upload.width && upload.height
        ? `, width: ${upload.width}, height: ${upload.height}`
        : "";
    return `  { src: '${upload.url}', alt: ''${dimensions}, caption: '' },`;
}

async function copy(value, button, label = "Copy") {
    try {
        await navigator.clipboard.writeText(value);
        button.textContent = "Copied";
    } catch {
        button.textContent = "Failed";
    }
    setTimeout(() => { button.textContent = label; }, 1200);
}

function uploadRow(upload, note) {
    const element = document.createElement("div");
    element.className = "item done";
    element.innerHTML = `
        <div class="line">
            <a class="name" target="_blank" rel="noreferrer"></a>
            <span class="meta"></span>
            <button class="copy" data-label="URL">URL</button>
            <button class="copy" data-label="Entry">Entry</button>
        </div>
        <code class="entry"></code>`;

    const link = element.querySelector("a");
    link.href = upload.url;
    link.textContent = upload.url.replace(/^https?:\/\//, "");
    element.querySelector(".meta").textContent = note ?? "";

    const entry = manifestEntry(upload);
    element.querySelector(".entry").textContent = entry.trim();

    const [urlButton, entryButton] = element.querySelectorAll(".copy");
    urlButton.onclick = () => copy(upload.url, urlButton, "URL");
    entryButton.onclick = () => copy(entry, entryButton, "Entry");
    return element;
}

function pendingRow(name) {
    const element = document.createElement("div");
    element.className = "item";
    element.innerHTML = `<div class="line"><span class="name"></span><span class="meta">waiting</span></div>`;
    element.querySelector(".name").textContent = name;
    list.prepend(element);
    return {
        status: (label, failed = false) => {
            element.querySelector(".meta").textContent = label;
            element.classList.toggle("failed", failed);
        },
        done: (upload, note) => element.replaceWith(uploadRow(upload, note)),
    };
}

async function handle(files) {
    for (const file of files) await process(file);
}

async function process(file) {
    const row = pendingRow(file.name);
    try {
        row.status("compressing");
        const { blob, type, width, height } = await compress(file);

        row.status("uploading");
        const headers = { "Content-Type": type, "X-Original-Name": asciiOnly(file.name) };
        if (width && height) {
            headers["X-Image-Width"] = String(width);
            headers["X-Image-Height"] = String(height);
        }

        const response = await fetch("/api/upload", { method: "POST", headers, body: blob });
        if (!response.ok) throw new Error((await response.text()).slice(0, 200) || response.statusText);

        const upload = await response.json();
        const saved = file.size > 0 ? Math.max(0, Math.round((1 - upload.size / file.size) * 100)) : 0;
        const dimensions = upload.width && upload.height ? ` · ${upload.width}×${upload.height}` : "";
        row.done(upload, `${formatBytes(file.size)} → ${formatBytes(upload.size)} (${saved}% smaller)${dimensions}`);
        remember(upload);
    } catch (error) {
        row.status(error.message || "failed", true);
    }
}

/** Resizes and re-encodes to WebP, unless the original is already the better answer. */
async function compress(file) {
    if (PASS_THROUGH.has(file.type)) return keepOriginal(file, await probeSize(file));

    let bitmap;
    try {
        bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch {
        // The browser cannot decode this format (HEIC on most browsers, for one).
        return keepOriginal(file, null);
    }

    const limit = Number(maxEdge.value);
    const longest = Math.max(bitmap.width, bitmap.height);
    const scale = limit > 0 && longest > limit ? limit / longest : 1;
    const width = Math.max(1, Math.round(bitmap.width * scale));
    const height = Math.max(1, Math.round(bitmap.height * scale));

    const canvas = typeof OffscreenCanvas === "function"
        ? new OffscreenCanvas(width, height)
        : Object.assign(document.createElement("canvas"), { width, height });
    const context = canvas.getContext("2d", { alpha: true });
    context.imageSmoothingQuality = "high";
    context.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();

    const options = { type: "image/webp", quality: Number(quality.value) / 100 };
    const blob = canvas.convertToBlob
        ? await canvas.convertToBlob(options)
        : await new Promise((resolve) => canvas.toBlob(resolve, options.type, options.quality));

    if (!blob) return keepOriginal(file, { width, height });
    // Re-encoding a small, already-optimised file can make it bigger. At this
    // scale the drawn size is the original size, so the dimensions still hold.
    if (scale === 1 && blob.size >= file.size && ALLOWED.has(file.type)) {
        return keepOriginal(file, { width, height });
    }
    return { blob, type: "image/webp", width, height };
}

async function probeSize(file) {
    try {
        const bitmap = await createImageBitmap(file);
        const size = { width: bitmap.width, height: bitmap.height };
        bitmap.close();
        return size;
    } catch {
        return null;
    }
}

function keepOriginal(file, size) {
    if (!ALLOWED.has(file.type)) throw new Error(`this browser cannot convert ${file.type || "this file"}`);
    return { blob: file, type: file.type, width: size?.width ?? null, height: size?.height ?? null };
}

function asciiOnly(value) {
    return value.replace(/[^\x20-\x7e]/g, "");
}

function remember(upload) {
    const kept = [upload, ...load().filter((item) => item.url !== upload.url)].slice(0, 12);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(kept)); } catch {}
    // "Recent" is rendered once on load, so this session's own uploads are not
    // listed twice.
}

function load() {
    try {
        const stored = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
        // Entries saved before dimensions were recorded are bare URL strings.
        return stored.map((item) => (typeof item === "string" ? { url: item } : item)).filter((item) => item?.url);
    } catch {
        return [];
    }
}

function renderRecent() {
    const uploads = load();
    recentHeading.hidden = uploads.length === 0;
    recent.replaceChildren(...uploads.map((upload) => uploadRow(upload, "")));
}

renderRecent();
</script>
</body>
</html>
