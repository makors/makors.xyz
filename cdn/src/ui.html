<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>photos</title>
<style>
:root {
    --bg: #0b0b0c;
    --surface: #131315;
    --line: #26262a;
    --text: #ededef;
    --muted: #8a8a92;
    --bad: #f87171;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 48px 24px 96px;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}
main { max-width: 680px; margin: 0 auto; }
h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; }
p.sub { margin: 0 0 32px; color: var(--muted); }
#drop {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
}
#drop:hover, #drop.over { border-color: #4a4a52; background: var(--surface); }
#drop strong { color: var(--text); font-weight: 500; }
.controls { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 20px; color: var(--muted); }
.controls label { display: flex; align-items: center; gap: 8px; }
select {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 8px; font: inherit;
}
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 40px 0 12px; }
#list { display: flex; flex-direction: column; gap: 8px; }
.item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    gap: 12px;
    align-items: center;
}
.item img {
    width: 52px; height: 52px; flex: 0 0 auto;
    object-fit: cover; border-radius: 4px; background: #1a1a1a;
}
.body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.caption {
    background: none; border: none; padding: 0; margin: 0;
    font: inherit; color: var(--text); width: 100%;
}
.caption::placeholder { color: #5a5a62; }
.caption:focus { outline: none; }
.row { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: 12.5px; }
.row a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row a:hover { color: var(--text); border-bottom-color: var(--line); }
.state { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 6px; flex: 0 0 auto; }
button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 4px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
}
button:hover { color: var(--text); border-color: #4a4a52; }
button.danger:hover { color: var(--bad); border-color: var(--bad); }
.item.pending { color: var(--muted); }
.item.failed .state { color: var(--bad); }
@media (prefers-color-scheme: light) {
    :root { --bg: #fff; --surface: #fafafa; --line: #e4e4e7; --text: #18181b; --muted: #71717a; }
}
</style>
</head>
<body>
<main>
    <h1>photos</h1>
    <p class="sub">Uploads go live on makors.xyz/photos straight away. Type a caption and it saves on its own.</p>

    <div id="drop" tabindex="0"><strong>Drop images here</strong><br>or click to choose</div>
    <input id="picker" type="file" accept="image/*" multiple hidden>

    <div class="controls">
        <label>Max edge
            <select id="maxEdge">
                <option value="1280">1280px</option>
                <option value="1920">1920px</option>
                <option value="2560" selected>2560px</option>
                <option value="3840">3840px</option>
                <option value="0">Keep size</option>
            </select>
        </label>
        <label>Quality
            <input id="quality" type="range" min="50" max="95" value="82">
            <span id="qualityValue">82</span>
        </label>
    </div>

    <h2 id="heading">Loading…</h2>
    <div id="list"></div>
</main>

<script type="module">
const PASS_THROUGH = new Set(["image/gif"]);
const ALLOWED = new Set(["image/webp", "image/avif", "image/jpeg", "image/png", "image/gif"]);
const SAVE_DELAY = 600;

const drop = document.getElementById("drop");
const picker = document.getElementById("picker");
const list = document.getElementById("list");
const heading = document.getElementById("heading");
const maxEdge = document.getElementById("maxEdge");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

quality.oninput = () => { qualityValue.textContent = quality.value; };
drop.onclick = () => picker.click();
drop.onkeydown = (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); picker.click(); } };
picker.onchange = () => { handle([...picker.files]); picker.value = ""; };

for (const name of ["dragenter", "dragover"]) {
    drop.addEventListener(name, (event) => { event.preventDefault(); drop.classList.add("over"); });
}
for (const name of ["dragleave", "drop"]) {
    drop.addEventListener(name, () => drop.classList.remove("over"));
}
drop.addEventListener("drop", (event) => {
    event.preventDefault();
    handle([...event.dataTransfer.files].filter((file) => file.type.startsWith("image/")));
});
document.addEventListener("paste", (event) => {
    const files = [...(event.clipboardData?.files ?? [])].filter((file) => file.type.startsWith("image/"));
    if (files.length) handle(files);
});

function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

const keyOf = (src) => src.split("/").pop();

function countPhotos() {
    const total = list.querySelectorAll(".item:not(.pending)").length;
    heading.textContent = total === 0 ? "Nothing posted yet" : `${total} photo${total === 1 ? "" : "s"}`;
}

/** One posted photo: editable caption, link, and removal. */
function photoRow(photo, note = "") {
    const key = keyOf(photo.src);
    const element = document.createElement("div");
    element.className = "item";
    element.innerHTML = `
        <img loading="lazy" alt="">
        <div class="body">
            <input class="caption" type="text" maxlength="140" placeholder="Add a caption…">
            <div class="row">
                <a target="_blank" rel="noreferrer"></a>
                <span class="state"></span>
            </div>
        </div>
        <div class="actions">
            <button class="copy">Copy</button>
            <button class="danger">Remove</button>
        </div>`;

    element.querySelector("img").src = photo.src;
    const link = element.querySelector("a");
    link.href = photo.src;
    link.textContent = key;

    const state = element.querySelector(".state");
    state.textContent = note;

    const caption = element.querySelector(".caption");
    caption.value = photo.caption ?? "";

    let timer;
    const save = async () => {
        state.textContent = "saving…";
        try {
            const response = await fetch(`/api/photos/${key}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ caption: caption.value }),
            });
            if (!response.ok) throw new Error(await response.text());
            state.textContent = "saved";
            setTimeout(() => { if (state.textContent === "saved") state.textContent = ""; }, 1400);
        } catch {
            state.textContent = "not saved";
            element.classList.add("failed");
        }
    };

    caption.oninput = () => {
        element.classList.remove("failed");
        clearTimeout(timer);
        timer = setTimeout(save, SAVE_DELAY);
    };
    caption.onblur = () => { clearTimeout(timer); save(); };
    caption.onkeydown = (event) => { if (event.key === "Enter") caption.blur(); };

    const copyButton = element.querySelector(".copy");
    copyButton.onclick = async () => {
        try {
            await navigator.clipboard.writeText(photo.src);
            copyButton.textContent = "Copied";
        } catch {
            copyButton.textContent = "Failed";
        }
        setTimeout(() => { copyButton.textContent = "Copy"; }, 1200);
    };

    // Two taps rather than a browser dialog, which would block the page.
    const removeButton = element.querySelector(".danger");
    let armed = false;
    removeButton.onclick = async () => {
        if (!armed) {
            armed = true;
            removeButton.textContent = "Sure?";
            setTimeout(() => { armed = false; removeButton.textContent = "Remove"; }, 3000);
            return;
        }
        removeButton.textContent = "…";
        try {
            const response = await fetch(`/api/photos/${key}`, { method: "DELETE" });
            if (!response.ok) throw new Error(await response.text());
            element.remove();
            countPhotos();
        } catch {
            removeButton.textContent = "Failed";
        }
    };

    return { element, focusCaption: () => caption.focus() };
}

function pendingRow(name) {
    const element = document.createElement("div");
    element.className = "item pending";
    element.innerHTML = `<div class="body"><span class="name"></span><div class="row"><span class="state">waiting</span></div></div>`;
    element.querySelector(".name").textContent = name;
    list.prepend(element);
    return {
        status: (label, failed = false) => {
            element.querySelector(".state").textContent = label;
            element.classList.toggle("failed", failed);
        },
        replace: (photo, note) => {
            const row = photoRow(photo, note);
            element.replaceWith(row.element);
            countPhotos();
            row.focusCaption();
        },
    };
}

async function handle(files) {
    for (const file of files) await process(file);
}

async function process(file) {
    const row = pendingRow(file.name);
    try {
        row.status("compressing");
        const { main, variants } = await renditions(file);

        row.status("uploading");
        const photo = await send("/api/upload", main, { "X-Original-Name": file.name.replace(/[^\x20-\x7e]/g, "") });

        // Smaller sizes join the same entry, so one photo stays one photo.
        for (const [index, variant] of variants.entries()) {
            row.status(`uploading (${index + 2} of ${variants.length + 1})`);
            await send("/api/upload", variant, { "X-Variant-Of": photo.key });
        }

        const total = main.blob.size + variants.reduce((sum, v) => sum + v.blob.size, 0);
        const saved = file.size > 0 ? Math.max(0, Math.round((1 - total / file.size) * 100)) : 0;
        const count = variants.length ? ` in ${variants.length + 1} sizes` : "";
        row.replace(photo, `${formatBytes(file.size)} \u2192 ${formatBytes(total)} (${saved}% smaller)${count}`);
    } catch (error) {
        row.status(error.message || "failed", true);
    }
}

async function send(url, rendition, extra) {
    const headers = { "Content-Type": rendition.type, ...extra };
    if (rendition.width && rendition.height) {
        headers["X-Image-Width"] = String(rendition.width);
        headers["X-Image-Height"] = String(rendition.height);
    }
    const response = await fetch(url, { method: "POST", headers, body: rendition.blob });
    if (!response.ok) throw new Error((await response.text()).slice(0, 200) || response.statusText);
    return response.json();
}

/** Long edges to emit below the main one, so the site can pick by viewport. */
const VARIANT_EDGES = [1280, 640];

/**
 * Produces the main rendition plus smaller ones for the srcset. Decoding is the
 * expensive part, so the bitmap is decoded once and drawn at each size.
 */
async function renditions(file) {
    if (PASS_THROUGH.has(file.type)) return { main: keepOriginal(file, await probeSize(file)), variants: [] };

    let bitmap;
    try {
        bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch {
        // The browser cannot decode this format (HEIC on most browsers, for one).
        return { main: keepOriginal(file, null), variants: [] };
    }

    try {
        const limit = Number(maxEdge.value);
        const longest = Math.max(bitmap.width, bitmap.height);
        const mainEdge = limit > 0 ? Math.min(limit, longest) : longest;

        const main = await drawTo(bitmap, mainEdge);
        // Re-encoding a small, already-optimised file can make it bigger.
        if (mainEdge === longest && main.blob.size >= file.size && ALLOWED.has(file.type)) {
            return { main: keepOriginal(file, { width: bitmap.width, height: bitmap.height }), variants: [] };
        }

        const variants = [];
        for (const edge of VARIANT_EDGES) {
            if (edge >= mainEdge) continue;
            variants.push(await drawTo(bitmap, edge));
        }
        return { main, variants };
    } finally {
        bitmap.close();
    }
}

async function drawTo(bitmap, longEdge) {
    const longest = Math.max(bitmap.width, bitmap.height);
    const scale = longest > longEdge ? longEdge / longest : 1;
    const width = Math.max(1, Math.round(bitmap.width * scale));
    const height = Math.max(1, Math.round(bitmap.height * scale));

    const canvas = typeof OffscreenCanvas === "function"
        ? new OffscreenCanvas(width, height)
        : Object.assign(document.createElement("canvas"), { width, height });
    const context = canvas.getContext("2d", { alpha: true });
    context.imageSmoothingQuality = "high";
    context.drawImage(bitmap, 0, 0, width, height);

    const options = { type: "image/webp", quality: Number(quality.value) / 100 };
    const blob = canvas.convertToBlob
        ? await canvas.convertToBlob(options)
        : await new Promise((resolve) => canvas.toBlob(resolve, options.type, options.quality));

    return { blob, type: "image/webp", width, height };
}

async function probeSize(file) {
    try {
        const bitmap = await createImageBitmap(file);
        const size = { width: bitmap.width, height: bitmap.height };
        bitmap.close();
        return size;
    } catch {
        return null;
    }
}

function keepOriginal(file, size) {
    if (!ALLOWED.has(file.type)) throw new Error(`this browser cannot convert ${file.type || "this file"}`);
    return { blob: file, type: file.type, width: size?.width ?? null, height: size?.height ?? null };
}

async function loadPosted() {
    try {
        const response = await fetch("/photos.json", { cache: "no-store" });
        const { photos } = await response.json();
        for (const photo of photos) list.append(photoRow(photo).element);
        countPhotos();
    } catch {
        heading.textContent = "Could not load the photo list";
    }
}

loadPosted();
</script>
</body>
</html>
